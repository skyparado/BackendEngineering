name: Verify API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build Docker image
        run: docker build -t macky-merch-api .
      - name: Verify container startup
        run: |
          docker run -d --name macky-check -p 3000:3000 -v macky-check-data:/app/data macky-merch-api
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 --retry-max-time 30 http://localhost:3000/api/products
      - name: Container logs
        if: always()
        run: docker logs macky-check || true
      - name: Clean up container
        if: always()
        run: docker rm -f macky-check || true
